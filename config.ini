# GeoCraft Configuration
osgi.install.area=file\:org.geocraft.target/EclipseSDK3.5.1
osgi.framework=file\:org.geocraft.target/EclipseSDK3.5.1/plugins/org.eclipse.osgi_3.5.1.R35x_v20090827.jar
osgi.configuration.area=@user.home/.geocraft
osgi.instance.area.default=@user.home/geocraft-workspace

# Bundle start levels
osgi.bundles.defaultStartLevel=4
osgi.bundles=\
    org.eclipse.core.runtime@start,\
    org.eclipse.equinox.common@2:start,\
    org.eclipse.equinox.simpleconfigurator@1:start,\
    org.eclipse.update.configurator@3:start

# System properties
eclipse.startTime=1234567890
osgi.requiredJavaVersion=21
eclipse.application=org.geocraft.application
eclipse.product=org.geocraft.product.product